# SPDX-License-Identifier: MIT
name: Weekly curated-link and archived-repository audit

on:
  schedule:
    - cron: '29 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check external and local curated links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 2 './README.md' './docs/CONTRIBUTING.md' './docs/checklists/**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Flag archived GitHub repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_archived_resources.py
